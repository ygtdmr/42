# Temel web sunucusu
server {
    listen 8080;
    host 127.0.0.1;
    client_max_body_size 1024000;
    error_page 404 /404.html     ;
    error_page 500 /500.html;

    # Varsayılan rota
    location / {
        allow_methods GET; #test denene
        root /var/www/html;
        index index.html;
        autoindex off;
    } # test

    # Dosya yükleme rotası
    location /upload {
        allow_methods GET POST DELETE;
        root /var/www/uploads;
        upload_dir /var/www/uploads/files;
    }

    # CGI rotası (PHP için)
    location /cgi-bin {
        allow_methods GET POST;
        root /var/www/cgi-bin;
        cgi_extension .php;
    }

    # Yönlendirme (Redirection) rotası
    location /eski-sayfa {
        return 301 /yeni-sayfa;
    }
}

# Farklı portta çalışan ikinci bir sunucu bloğu
server{
    listen 8081;
    host 127.0.0.1;
    client_max_body_size 500000;

    location / {
        allow_methods GET;
        root /var/www/ikinci_site;
        index default.html;
        autoindex on;
    }
}

