server {
	listen 127.0.0.1:8080;
	root tester/www;
	location / {
		allow_methods GET;
		cgi .bla /workspace/42/webserv/tester/cgi_tester;
		index index.txt;
	}

	location /post_body {
		allow_methods POST;
		upload_dir /workspace/42/webserv/tester/post_body;
		client_max_body_size 100;
	}

	location /directory {
		allow_methods GET POST;
		root /var/www/html/YoupiBanane;
		index youpi.bad_extension;
		cgi .bla /workspace/42/webserv/tester/cgi_tester;
	}
}
