server {
	listen 80;
	root /var/www/html;
	location / {
		allow_methods GET;
		cgi .bla /workspace/42/webserv/tester/cgi_tester;
	}

	location /post_body {
		allow_methods POST;
		client_max_body_size 100;
	}

	location /directory {
		allow_methods GET POST;
		root /var/www/html/YoupiBanane;
		index youpi.bad_extension;
		cgi .bla /workspace/42/webserv/tester/cgi_tester;
	}
}
