# Temel web sunucusu
  server {
    listen 80;
    client_max_body_size 1M;
    #error_page 404 /404.html     ;
    #error_page 500 502 503 504 /50x.html;

    # Varsayılan rota
    location / {
        allow_methods GET 		 ; #test denene
        root /var/www/html;
        index index.html;
    } # test

	location /assets {
		allow_methods GET;
		root /var/www/html/assets///;
		autoindex on;
	}

    # Dosya yükleme rotası
    location /upload {
        allow_methods GET POST DELETE;
        root /var/www/uploads;
        upload_dir /var/www/uploads/files;
    }

    # CGI rotası (PHP için)
    location /cgi-bin {
        allow_methods GET POST;
        root /var/www/cgi-bin;
        cgi_extension .php;
    }

    # Yönlendirme (Redirection) rotası
    location /redirect {
        return 301 https://42.fr;
    }
}

# Farklı portta çalışan ikinci bir sunucu bloğu
server {
    listen 8081;
    client_max_body_size 1M;

    location / {
        allow_methods GET;
        root /var/www/html;
        index default.html;
        autoindex on;
    }
}

